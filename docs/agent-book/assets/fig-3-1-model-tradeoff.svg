<svg viewBox="0 0 680 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>能力、速度、成本的取舍三角</title>
  <desc>能力、速度、成本三者不可兼得，只能取其二</desc>

  <!-- 三角边 -->
  <line x1="340" y1="104" x2="120" y2="348" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="120" y1="348" x2="560" y2="348" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="560" y1="348" x2="340" y2="104" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 顶点 · 能力（强） -->
  <rect x="250" y="40" width="180" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="66" text-anchor="middle" class="th" font-size="16" font-weight="700" fill="#3C3489">能力（强）</text>
  <text x="340" y="88" text-anchor="middle" class="ts" font-size="12" fill="#534AB7">想得深、答得准</text>

  <!-- 顶点 · 速度（快） -->
  <rect x="30" y="348" width="180" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="374" text-anchor="middle" class="th" font-size="16" font-weight="700" fill="#085041">速度（快）</text>
  <text x="120" y="396" text-anchor="middle" class="ts" font-size="12" fill="#0F6E56">回得快、不卡顿</text>

  <!-- 顶点 · 成本（省） -->
  <rect x="470" y="348" width="180" height="64" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="560" y="374" text-anchor="middle" class="th" font-size="16" font-weight="700" fill="#633806">成本（省）</text>
  <text x="560" y="396" text-anchor="middle" class="ts" font-size="12" fill="#854F0B">便宜、用得起</text>

  <!-- 中心结论 -->
  <rect x="230" y="210" width="220" height="64" rx="12" fill="#F4F7FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="236" text-anchor="middle" class="th" font-size="16" font-weight="700" fill="#0C447C">三者不可兼得</text>
  <text x="340" y="258" text-anchor="middle" class="ts" font-size="12" fill="#185FA5">只能取其二</text>
</svg>
