<svg viewBox="0 0 680 280" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>多模态：听、看、说</title>
  <desc>听（语音转文字）、看（图片理解）、说（文字转语音）三件事</desc>

  <defs>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,6 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- 列 1 · 听 -->
  <text x="120" y="28" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#0C447C">听</text>
  <rect x="20" y="40" width="200" height="58" rx="10" fill="#DCEBFA" stroke="#185FA5" stroke-width="1"/>
  <text x="120" y="74" text-anchor="middle" class="ts" font-size="13" fill="#0C447C">你说话（语音）</text>
  <line x1="120" y1="98" x2="120" y2="162" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="120" y="122" text-anchor="middle" class="ts" font-size="12" fill="#185FA5">转写（服务端）</text>
  <rect x="20" y="172" width="200" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="206" text-anchor="middle" class="ts" font-size="13" fill="#085041">文字 → 模型能懂</text>

  <!-- 列 2 · 看 -->
  <text x="340" y="28" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#3C3489">看</text>
  <rect x="240" y="40" width="200" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="74" text-anchor="middle" class="ts" font-size="13" fill="#3C3489">你发图（图片）</text>
  <line x1="340" y1="98" x2="340" y2="162" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="340" y="122" text-anchor="middle" class="ts" font-size="12" fill="#534AB7">理解</text>
  <rect x="240" y="172" width="200" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="206" text-anchor="middle" class="ts" font-size="13" fill="#085041">信息 → 模型能懂</text>

  <!-- 列 3 · 说 -->
  <text x="560" y="28" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#085041">说</text>
  <rect x="460" y="40" width="200" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="560" y="74" text-anchor="middle" class="ts" font-size="13" fill="#085041">Agent 的文字回答</text>
  <line x1="560" y1="98" x2="560" y2="162" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="560" y="122" text-anchor="middle" class="ts" font-size="12" fill="#0F6E56">合成（服务端）</text>
  <rect x="460" y="172" width="200" height="58" rx="10" fill="#DCEBFA" stroke="#185FA5" stroke-width="1"/>
  <text x="560" y="206" text-anchor="middle" class="ts" font-size="13" fill="#0C447C">语音 → 你能听</text>
</svg>
