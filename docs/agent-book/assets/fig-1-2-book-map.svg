<svg viewBox="0 0 680 508" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>企业级 Agent 的五层地图</title>
  <desc>智力、能力、协作、边界、治理五层，从内到外构成企业级 Agent</desc>

  <rect x="40" y="40" width="600" height="448" rx="20" fill="#F4F7FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="66" text-anchor="middle" class="th" fill="#0C447C">企业级 Agent</text>

  <rect x="56" y="82" width="568" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="76" y="106" dominant-baseline="central" class="th" fill="#3C3489">智力</text>
  <text x="112" y="106" dominant-baseline="central" class="ts" fill="#534AB7">怎么想、怎么记</text>
  <text x="76" y="132" dominant-baseline="central" class="ts" fill="#534AB7">模型分类 · session 上下文 · 记忆沉淀</text>

  <rect x="56" y="158" width="568" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="182" dominant-baseline="central" class="th" fill="#085041">能力</text>
  <text x="112" y="182" dominant-baseline="central" class="ts" fill="#0F6E56">怎么做、怎么表达</text>
  <text x="76" y="208" dominant-baseline="central" class="ts" fill="#0F6E56">skill · API 转 MCP · 多模态 · UI</text>

  <rect x="56" y="234" width="568" height="70" rx="10" fill="#DCEBFA" stroke="#185FA5" stroke-width="0.5"/>
  <text x="76" y="258" dominant-baseline="central" class="th" fill="#0C447C">协作</text>
  <text x="112" y="258" dominant-baseline="central" class="ts" fill="#185FA5">怎么一起干</text>
  <text x="76" y="284" dominant-baseline="central" class="ts" fill="#185FA5">知识库共享 · 子 agent · task 调度</text>

  <rect x="56" y="310" width="568" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="76" y="334" dominant-baseline="central" class="th" fill="#633806">边界</text>
  <text x="112" y="334" dominant-baseline="central" class="ts" fill="#854F0B">立工作纪律</text>
  <text x="76" y="360" dominant-baseline="central" class="ts" fill="#854F0B">脱敏 · 意图识别 · 相关性检查</text>

  <rect x="56" y="386" width="568" height="70" rx="10" fill="#FBE3E6" stroke="#A52A3A" stroke-width="0.5"/>
  <text x="76" y="410" dominant-baseline="central" class="th" fill="#7A1F2B">治理</text>
  <text x="112" y="410" dominant-baseline="central" class="ts" fill="#A52A3A">系统安全与运营</text>
  <text x="76" y="436" dominant-baseline="central" class="ts" fill="#A52A3A">安全审计 · 可观测性 · 后台管理</text>
</svg>
