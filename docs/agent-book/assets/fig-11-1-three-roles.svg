<svg viewBox="0 0 680 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>三层分工：对话者 / 协调者 / 专家</title>
  <desc>用户请求，经对话者接住、协调者调度、专家钻研，再把结论回传</desc>

  <defs>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,6 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="arru" markerWidth="8" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,6 L6,6 L3,0 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- 用户 -->
  <text x="340" y="24" text-anchor="middle" class="ts" font-size="13" font-weight="700" fill="#6B7280">用户（提问）</text>
  <line x1="340" y1="30" x2="340" y2="38" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrd)"/>

  <!-- 对话者 -->
  <rect x="170" y="40" width="340" height="72" rx="12" fill="#DCEBFA" stroke="#185FA5" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#0C447C">对话者（chat agent）</text>
  <text x="340" y="92" text-anchor="middle" class="ts" font-size="12" fill="#185FA5">接得住：跟你聊天、把结果说清楚</text>

  <line x1="340" y1="112" x2="340" y2="146" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrd)"/>

  <!-- 协调者 -->
  <rect x="170" y="150" width="340" height="72" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="340" y="178" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#633806">协调者（coordinator）</text>
  <text x="340" y="202" text-anchor="middle" class="ts" font-size="12" fill="#854F0B">调得动：统筹调度、决定找谁</text>

  <line x1="340" y1="222" x2="340" y2="256" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrd)"/>

  <!-- 专家 -->
  <rect x="170" y="260" width="340" height="72" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="340" y="288" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#085041">专家（子 agent）</text>
  <text x="340" y="312" text-anchor="middle" class="ts" font-size="12" fill="#0F6E56">钻得深：专业领域拿主意</text>

  <!-- 结论回传（右侧向上） -->
  <path d="M 520 296 L 520 76" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arru)" stroke-dasharray="4 3"/>
  <text x="540" y="190" class="ts" font-size="12" fill="#6B7280">结论回传</text>
</svg>
