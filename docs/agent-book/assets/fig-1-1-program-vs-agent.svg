<svg viewBox="0 0 680 264" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>写死的程序 vs 会思考的 Agent</title>
  <desc>左边是规则确定的程序，右边是能理解意图并调用工具的 Agent</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="180" y="40" text-anchor="middle" class="th" fill="#444441">写死的程序</text>
  <text x="500" y="40" text-anchor="middle" class="th" fill="#085041">会思考的 Agent</text>

  <line x1="180" y1="108" x2="180" y2="122" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="168" x2="180" y2="182" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="108" x2="500" y2="122" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="168" x2="500" y2="182" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="64" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="86" text-anchor="middle" dominant-baseline="central" class="th" fill="#444441">投币 / 点按钮</text>

  <rect x="80" y="124" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="146" text-anchor="middle" dominant-baseline="central" class="th" fill="#444441">固定规则 if...then</text>

  <rect x="80" y="184" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="206" text-anchor="middle" dominant-baseline="central" class="th" fill="#444441">掉出确定的结果</text>

  <rect x="400" y="64" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="500" y="86" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">理解你的意图</text>

  <rect x="400" y="124" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="500" y="146" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">查资料 / 调工具</text>

  <rect x="400" y="184" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="500" y="206" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">组织出结果</text>

  <text x="180" y="246" text-anchor="middle" class="ts" fill="#5F5E5A">输入确定，输出确定</text>
  <text x="500" y="246" text-anchor="middle" class="ts" fill="#0F6E56">能应对没写死的情况（但也会犯错）</text>
</svg>
