<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>先判意图，再动手</title>
  <desc>用户一句话，先判是任务还是闲聊、要不要规划，再分流处理</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- 用户 -->
  <rect x="260" y="28" width="160" height="48" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="340" y="57" text-anchor="middle" class="ts" font-size="14" fill="#4B5563">用户说一句话</text>

  <line x1="340" y1="76" x2="340" y2="108" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 判断节点 -->
  <rect x="230" y="112" width="220" height="60" rx="12" fill="#DCEBFA" stroke="#185FA5" stroke-width="1.5"/>
  <text x="340" y="136" text-anchor="middle" class="th" font-size="14" font-weight="700" fill="#0C447C">先判意图</text>
  <text x="340" y="158" text-anchor="middle" class="ts" font-size="12" fill="#185FA5">是不是任务？要不要规划？</text>

  <!-- 分支箭头 -->
  <path d="M 300 172 L 115 250" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 340 172 L 340 250" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 380 172 L 565 250" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 闲聊 -->
  <rect x="20" y="252" width="190" height="66" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="115" y="278" text-anchor="middle" class="th" font-size="14" font-weight="700" fill="#085041">闲聊</text>
  <text x="115" y="300" text-anchor="middle" class="ts" font-size="12" fill="#0F6E56">直接回话，不调工具</text>

  <!-- 简单任务 -->
  <rect x="245" y="252" width="190" height="66" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="278" text-anchor="middle" class="th" font-size="14" font-weight="700" fill="#3C3489">简单任务</text>
  <text x="340" y="300" text-anchor="middle" class="ts" font-size="12" fill="#534AB7">一步干完</text>

  <!-- 复杂任务 -->
  <rect x="470" y="252" width="190" height="66" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="565" y="278" text-anchor="middle" class="th" font-size="14" font-weight="700" fill="#633806">复杂任务</text>
  <text x="565" y="300" text-anchor="middle" class="ts" font-size="12" fill="#854F0B">先规划，再分步干</text>
</svg>
