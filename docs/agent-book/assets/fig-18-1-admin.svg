<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>后台管理四件事</title>
  <desc>管人（邀请制）、管权（分级管理员）、管资源（模型分权限）、管流程（邀请注册审核）</desc>

  <text x="340" y="30" text-anchor="middle" class="th" font-size="15" font-weight="700" fill="#7A1F2B">后台管理 · 四件事</text>

  <!-- 管人 -->
  <rect x="20" y="50" width="310" height="112" rx="14" fill="#FBE3E6" stroke="#A52A3A" stroke-width="1.5"/>
  <text x="42" y="80" class="th" font-size="16" font-weight="700" fill="#7A1F2B">管人</text>
  <text x="100" y="80" class="ts" font-size="13" fill="#A52A3A">谁能进来</text>
  <text x="42" y="108" class="ts" font-size="13" fill="#A52A3A">邀请制，公司说了算</text>
  <text x="42" y="132" class="ts" font-size="13" fill="#A52A3A">不开放自注册</text>

  <!-- 管权 -->
  <rect x="350" y="50" width="310" height="112" rx="14" fill="#DCEBFA" stroke="#185FA5" stroke-width="1.5"/>
  <text x="372" y="80" class="th" font-size="16" font-weight="700" fill="#0C447C">管权</text>
  <text x="430" y="80" class="ts" font-size="13" fill="#185FA5">谁能干什么</text>
  <text x="372" y="108" class="ts" font-size="13" fill="#185FA5">分级管理员</text>
  <text x="372" y="132" class="ts" font-size="13" fill="#185FA5">每一级只做份内事</text>

  <!-- 管资源 -->
  <rect x="20" y="178" width="310" height="112" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="42" y="208" class="th" font-size="16" font-weight="700" fill="#085041">管资源</text>
  <text x="112" y="208" class="ts" font-size="13" fill="#0F6E56">谁能配什么</text>
  <text x="42" y="236" class="ts" font-size="13" fill="#0F6E56">模型也分权限</text>
  <text x="42" y="260" class="ts" font-size="13" fill="#0F6E56">成本不失控</text>

  <!-- 管流程 -->
  <rect x="350" y="178" width="310" height="112" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="372" y="208" class="th" font-size="16" font-weight="700" fill="#633806">管流程</text>
  <text x="442" y="208" class="ts" font-size="13" fill="#854F0B">怎么招人</text>
  <text x="372" y="236" class="ts" font-size="13" fill="#854F0B">邀请 → 注册 → 审核</text>
  <text x="372" y="260" class="ts" font-size="13" fill="#854F0B">可控 · 可追溯</text>
</svg>
