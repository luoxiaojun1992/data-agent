# Presidio recognizer registry — pure rule mode (SPEC-068).
# Disable the NER recognizer (SpacyRecognizer) so PII detection relies only on
# regex PatternRecognizer (predefined + custom Chinese rules). The spacy engine
# (en_core_web_lg) is still loaded for tokenization, but does not drive entity
# detection. All recognizers run for "en"; regex matching is language-agnostic.
#
# NOTE on \b: Python's \b treats CJK as word chars, so there is no boundary
# between a Chinese char and an adjacent digit — \b never matches inside CJK
# text. Use (?<!\d)...(?!\d) lookarounds instead so Chinese PII (ID card /
# phone) is actually detected.
supported_languages:
  - en
global_regex_flags: 26

recognizers:
  # ---- disable NER recognizer (pure rule mode) ----
  - name: SpacyRecognizer
    type: predefined
    enabled: false

  # ---- built-in predefined pattern recognizers (regex only) ----
  - name: EmailRecognizer
    type: predefined
  - name: PhoneRecognizer
    type: predefined
  - name: CreditCardRecognizer
    type: predefined
  - name: IpRecognizer
    type: predefined
  - name: UrlRecognizer
    type: predefined
  - name: IbanRecognizer
    type: predefined
  - name: CryptoRecognizer
    type: predefined
  - name: DateRecognizer
    type: predefined

  # ---- custom Chinese PII rules (regex, lookaround instead of \b) ----
  - name: CnIdCardRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_id_card"
        regex: "(?<!\\d)\\d{17}[\\dXx](?!\\d)"
        score: 0.9
    supported_entity: "CN_ID_CARD"
    context: ["身份证", "ID card", "idcard", "身份证号"]

  - name: CnPhoneRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_phone"
        regex: "(?<!\\d)1[3-9]\\d{9}(?!\\d)"
        score: 0.9
    supported_entity: "CN_PHONE"
    context: ["手机", "电话", "mobile", "phone"]

  - name: CnBankCardRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_bank_card"
        regex: "(?<!\\d)\\d{16,19}(?!\\d)"
        score: 0.7
    supported_entity: "CN_BANK_CARD"
    context: ["银行卡", "卡号", "bank", "card"]

  - name: CnUsccRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_uscc"
        regex: "(?<![0-9A-HJ-NPQRTUWXY])[0-9A-HJ-NPQRTUWXY]{18}(?![0-9A-HJ-NPQRTUWXY])"
        score: 0.8
    supported_entity: "CN_USCC"
    context: ["统一社会信用代码", "信用代码", "USCC"]
