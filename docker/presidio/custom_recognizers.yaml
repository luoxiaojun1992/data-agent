# Presidio recognizer registry (SPEC-068).
# Enable the NER recognizer (SpacyRecognizer) so named entities (PERSON /
# LOCATION / ORGANIZATION / DATE_TIME ...) are also detected, on top of the
# regex PatternRecognizers (predefined + custom Chinese rules). The spacy
# en_core_web_lg engine already runs the full pipeline (NER included) and holds
# ~730MB regardless of this flag, so enabling the recognizer only adds the
# entity-mapping step at negligible cost — better coverage for the same cost.
#
# NOTE on \b: Python's \b treats CJK as word chars, so there is no boundary
# between a Chinese char and an adjacent digit — \b never matches inside CJK
# text. Use (?<!\d)...(?!\d) lookarounds instead so Chinese PII (ID card /
# phone) is actually detected.
supported_languages:
  - en
global_regex_flags: 26

recognizers:
  # ---- NER recognizer (enabled: better entity coverage, same resource cost) ----
  - name: SpacyRecognizer
    type: predefined

  # ---- built-in predefined pattern recognizers (regex) ----
  - name: EmailRecognizer
    type: predefined
  - name: PhoneRecognizer
    type: predefined
  - name: CreditCardRecognizer
    type: predefined
  - name: IpRecognizer
    type: predefined
  - name: UrlRecognizer
    type: predefined
  - name: IbanRecognizer
    type: predefined
  - name: CryptoRecognizer
    type: predefined
  - name: DateRecognizer
    type: predefined

  # ---- custom Chinese PII rules (regex, lookaround instead of \b) ----
  - name: CnIdCardRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_id_card"
        regex: "(?<!\\d)\\d{17}[\\dXx](?!\\d)"
        score: 0.9
    supported_entity: "CN_ID_CARD"
    context: ["身份证", "ID card", "idcard", "身份证号"]

  - name: CnPhoneRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_phone"
        regex: "(?<!\\d)1[3-9]\\d{9}(?!\\d)"
        score: 0.9
    supported_entity: "CN_PHONE"
    context: ["手机", "电话", "mobile", "phone"]

  - name: CnBankCardRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_bank_card"
        regex: "(?<!\\d)\\d{16,19}(?!\\d)"
        score: 0.7
    supported_entity: "CN_BANK_CARD"
    context: ["银行卡", "卡号", "bank", "card"]

  - name: CnUsccRecognizer
    supported_language: "en"
    type: custom
    patterns:
      - name: "cn_uscc"
        regex: "(?<![0-9A-HJ-NPQRTUWXY])[0-9A-HJ-NPQRTUWXY]{18}(?![0-9A-HJ-NPQRTUWXY])"
        score: 0.8
    supported_entity: "CN_USCC"
    context: ["统一社会信用代码", "信用代码", "USCC"]
