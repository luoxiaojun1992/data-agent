# UI 测试专用 nginx 配置（不含 SSL）。
# 与生产 nginx/default.conf 的差异：移除 listen 443 ssl + ssl_certificate（依赖
# ./nginx/ssl 自签名证书，CI 环境不生成），其余代理规则完全一致，保证前端
# SPEC-097 的 getApiHost() 能通过同源 /api/v1 反向代理访问后端。
server {
    listen 80;
    server_name _;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API backend
    location /api/ {
        proxy_pass http://data-agent:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming: deepseek-v4-pro reasoning can pause 60s+ between chunks.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SeaweedFS direct file download — bypasses backend, stream from filer
    location /files/ {
        rewrite ^/files/(.*) /$1 break;
        proxy_pass http://seaweedfs:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
