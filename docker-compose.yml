# DataAgent Development Environment
# Phase 1 (P1): All infrastructure services for local development.

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1 200' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  arcadedb:
    image: arcadedata/arcadedb:latest
    ports:
      - "7687:7687"
      - "2480:2480"
    environment:
      # Bolt 是可选插件，必须显式启用（否则 7687 不监听）；defaultDatabases 启动时自动创建 kbgraph
      - JAVA_OPTS=-Darcadedb.server.rootPassword=arcadedb-root-pw -Darcadedb.server.databaseDirectory=/home/arcadedb/databases -Darcadedb.server.defaultDatabases=kbgraph[root] -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin -Xmx512m
    volumes:
      - arcadedb-data:/home/arcadedb
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2480/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs
    ports:
      - "9333:9333"
      - "8081:8080"
    command: server -master -filer -dir=/data
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=data_agent
      - MYSQL_USER=agent
      - MYSQL_PASSWORD=agent123
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]

  mockllm:
    build:
      context: mockllm
      dockerfile: Dockerfile
    image: data-agent-mockllm:latest
    ports:
      - "8082:8082"
    environment:
      REDIS_ADDR: redis:6379
      MOCKLLM_PORT: "8082"
      MOCK_ADMIN_TOKEN: test-admin-token
      MOCK_CHUNK_DELAY_MS: "5"
      MOCK_DEFAULT_REPLY: "Mock LLM: please inject test response"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama:
    build:
      context: docker/ollama
      dockerfile: Dockerfile
    image: data-agent-ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - WORKERS=1
      # SPEC-068: pure rule mode — no NER model (no_op NLP engine), only regex
      # PatternRecognizer (predefined + Chinese PII rules).
      - NLP_CONF_FILE=/app/nlp.yaml
      - RECOGNIZER_REGISTRY_CONF_FILE=/app/custom_recognizers.yaml
    volumes:
      - ./docker/presidio/nlp.yaml:/app/nlp.yaml:ro
      - ./docker/presidio/custom_recognizers.yaml:/app/custom_recognizers.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  data-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_ADDR=redis:6379
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_VECTOR_DIM=768
      - EMBEDDING_BASE_URL=http://ollama:11434/v1
      - EMBEDDING_MODEL=nomic-embed-text
      - MYSQL_DSN=agent:agent123@tcp(mysql:3306)/data_agent?charset=utf8mb4&parseTime=True
      - SEAWEEDFS_MASTER=http://seaweedfs:9333
      - SEAWEEDFS_FILER=http://seaweedfs:8888
      - LLM_BASE_URL=http://mockllm:8082/v1
      - LLM_API_KEY=test-key
      - LLM_MODEL=mock-gpt-4o
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - VAULT_MOUNT_PATH=secret
      - INVITE_HMAC_SECRET=dev-invite-secret-key
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - ARCADE_URI=bolt://arcadedb:7687
      - ARCADE_USERNAME=root
      - ARCADE_PASSWORD=arcadedb-root-pw
      - ARCADE_DATABASE=kbgraph
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      vault:
        condition: service_healthy
      mockllm:
        condition: service_healthy
      mysql:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
      arcadedb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      data-agent:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - data-agent
    restart: unless-stopped

volumes:
  mongodb-data:
  qdrant-data:
  seaweedfs-data:
  ollama-data:
  mysql-data:
  arcadedb-data:
