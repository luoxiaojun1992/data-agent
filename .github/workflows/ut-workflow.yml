name: Go Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-ut:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Tests with Coverage
        run: |
          # Exclude /mocks packages from coverage: they are auto-generated test
          # helpers with no tests of their own and would unfairly drag down the
          # aggregate coverage percentage (SPEC-055 introduced many mocks).
          # SPEC-058: adk/* packages depend on external infra (MongoDB/LLM/Qdrant)
          # and are tested via Docker integration, not UT. Per 晓军 directive
          # (2026-07-21), they are excluded from the UT coverage gate; their tests
          # have been deleted. The 98% gate applies to application-layer packages
          # (api/config/domain/logic/service) only.
          COVERPKG=$(go list ./internal/api/... ./internal/config/... ./internal/domain/... ./internal/logic/... ./internal/service/... | grep -v '/mocks' | paste -sd, -)
          go test -gcflags=all=-l -p=1 -count=1 -coverprofile=coverage.out \
            -coverpkg="$COVERPKG" \
            ./internal/...

      - name: Coverage Gate
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          # SPEC-105: coverage gate lowered to 90%. Live infra dependencies
          # (kb_index/sql/knowledge indexing), route registration, pure
          # delegation, SSE streaming, DNS and unreachable log branches are not
          # unit-testable under the "tests-only" constraint, so 98% is physically
          # unreachable. 90% is the agreed threshold per 晓军 directive.
          if (( $(echo "$TOTAL < 90" | bc -l) )); then
            echo "ERROR: Coverage ${TOTAL}% below 90% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${TOTAL}% >= 90%"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: coverage.out
          retention-days: 7
          if-no-files-found: warn
