name: License Dependency Review

# ============================================================
# ⚠️ 已停用（2026-11-04）
#
# 原因：GitHub 仓库尚未开启「依赖图谱」（Dependency graph），
# dependency-review-action 依赖图谱数据，长期报
#   "Dependency review is not supported on this repository.
#    Please ensure that Dependency graph is enabled"
# 失败，导致 PR 检查红灯。
#
# 启用步骤：
#   1. GitHub 仓库 Settings → Code security and analysis → Dependency graph → 启用
#   2. 取消下方 on.pull_request 的注释，并删除 on.workflow_dispatch 一行
#   3. 核对 allow-licenses 白名单与 SPEC-081 license 红线保持一致
# ============================================================

on:
  # 恢复时取消注释（依赖图谱启用后）：
  # pull_request:
  #   branches: [main]
  # 停用期间仅保留手动触发，避免 PR 自动跑、长期红灯：
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # 用于在 PR 中写失败摘要评论

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review (license + vulnerability)
        uses: actions/dependency-review-action@v5
        with:
          # 白名单：仅允许宽松/非传染性 license。
          # GPL-*/AGPL-*/LGPL-*/SSPL-*/BUSL-* 均不在名单内，会被拒绝。
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSD-3-Clause-Clear, 0BSD, ISC, MPL-2.0, EPL-2.0, Unlicense, CC0-1.0, Zlib, BlueOak-1.0.0, BSL-1.0, WTFPL, Python-2.0, Artistic-2.0, PostgreSQL, OFL-1.1, MulanPSL-2.0, Unicode-DFS-2016
          # 漏洞阈值：high 及以上才失败（本次关注点是 license）。
          fail-on-severity: high
          # 失败时在 PR 中写摘要评论（成功时保持安静）。
          comment-summary-in-pr: on-failure
